name: sync-to-github

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-to-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: configure git
        run: |
          git config user.name "gitea-sync"
          git config user.email "sync@local"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: fetch local hiscores and rebuild tracker data
        env:
          TRACKER_API_BASE: ${{ secrets.TRACKER_API_BASE }}
        run: |
          node scripts/tracker.mjs --all

      - name: post hiscore leaderboards to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          node scripts/post-hiscores.mjs

      - name: commit updated tracker data
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: daily player snapshots"
          fi

      - name: configure github remote
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git remote remove github 2>/dev/null || true
          git remote add github https://x-access-token:${GH_TOKEN}@github.com/shalkith/Paul-Ville.git

      - name: configure gitea origin remote
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git remote set-url origin https://gitea-sync:${SYNC_TOKEN}@192.168.99.108:3000/Shalkith/Paul-Ville-Tracker.git

      - name: push Gitea custom branch first
        run: |
          git push origin custom

      - name: push to github
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          # Force-push to replace the GitHub main history that was previously
          # built from rebased upstream/original-repo commits. Gitea custom is
          # now the source of truth for Paul-Ville data.
          git push github custom:main --force
